# cargo-deny — supply-chain gate (docs/02 §3, docs/03 §2, CI Security stage docs/03 §6).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Accepted findings. Each needs a reason and a re-check trigger — an ignore
# list without those is how a real advisory hides behind a stale one.
ignore = [
    # `paste` (transitive: fastembed → tokenizers → paste) is archived by its
    # author. Unmaintained, NOT vulnerable: no advisory describes a defect, and
    # RustSec itself records "no safe upgrade is available". The crate is a
    # compile-time macro helper — it contributes no runtime code and no I/O.
    # Re-check when fastembed moves to `pastey`, or when the ADR-011 revisit
    # reopens the embeddings choice.
    "RUSTSEC-2024-0436",
]

[licenses]
version = 2
# Our own unpublished workspace crates (LicenseRef-Proprietary) are exempt;
# the allowlist below governs everything that actually ships from crates.io.
private = { ignore = true }
# Reviewed as part of the SBOM gate (docs/03 §2). Extend deliberately, never wildcard.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    # 0BSD is public-domain-equivalent — strictly more permissive than MIT,
    # with no attribution requirement (quoted_printable, via lettre/SMTP).
    "0BSD",
    # MPL-2.0 is *file-level* copyleft: it reaches modified MPL files, never
    # the program that links them. `option-ext` is consumed unmodified as a
    # library, which is exactly the case MPL-2.0 §3.3 permits. Revisit only if
    # we ever fork the crate — then its files stay MPL and must be published.
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace-internal path deps (`foo.workspace = true`) are not version
# wildcards; only registry deps must pin versions.
allow-wildcard-paths = true
# The purity rule (CLAUDE.md invariant 3) is enforced structurally by
# `cargo xtask arch-test`; cargo-deny gates licenses/advisories/sources.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
