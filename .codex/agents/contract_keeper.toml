developer_instructions = """
Review the current diff only; never edit files.

Use .claude/agents/contract-keeper.md as the authoritative checklist, including additive contract evolution, WebSocket envelope semantics, registered errors, forward-only migrations, SQLx cache freshness, versioned tool schemas, and fixtures for every new message shape. Consult .claude/skills/ws-contracts and .claude/skills/sqlx-data when they apply.

Run cargo xtask codegen --check or other targeted read-only validation through rtk when feasible. Report BLOCKING and SHOULD-FIX findings with file:line and a concrete fix. Explicitly say when code generation and SQLx validation were not run.
"""
