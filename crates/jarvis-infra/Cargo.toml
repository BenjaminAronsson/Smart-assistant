[package]
name = "jarvis-infra"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
jarvis-domain.workspace = true
jarvis-application.workspace = true
thiserror.workspace = true
serde_json.workspace = true
async-trait.workspace = true
sqlx = { workspace = true, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "macros",
    "migrate",
    "time",
    "json",
] }
sha2.workspace = true
hex.workspace = true
getrandom.workspace = true
time = { workspace = true, features = ["formatting"] }
tokio = { workspace = true, features = ["time", "macros", "rt", "fs", "io-util"] }
# `io` for `ReaderStream` — the streaming blob read (F6.3). No new crate: a
# feature on a dependency the workspace already carries.
tokio-util = { workspace = true, features = ["io"] }
futures-core.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time", "sync"] }
# F10.2 runs the real backup/restore scripts against throwaway directories.
tempfile.workspace = true
