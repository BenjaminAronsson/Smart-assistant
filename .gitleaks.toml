# gitleaks configuration for the CI secret scan (`.github/workflows/ci.yml`).
#
# The default rule set is kept in full — this file only narrows it, and only
# for values that are provably not credentials. Every entry needs a reason a
# reviewer can check, because an allowlist is the one place where a real leak
# can be waved through by accident.

[extend]
useDefault = true

[allowlist]
description = "Canonical non-secret constants that trip the entropy heuristic"
# Match against the whole matched line, not just the extracted secret: what
# makes the checksum below provably not a credential is the `<NAME>_SHA=` on its
# left, which the extracted secret does not include.
regexTarget = "match"

regexes = [
  # `01ARZ3NDEKTSV4RRFFQ69G5FAV` is *the* example ULID from the ULID
  # specification, and this codebase uses it as the fixture identifier
  # everywhere a `RunId`/`SessionId`/`DeviceId` is needed in a test or a doc
  # comment. It is a public example value, it identifies nothing, and it grants
  # nothing: IDs are not credentials here (docs/05 §6 — authority comes from
  # the device class and an opaque token, never from an identifier).
  #
  # `generic-api-key` flags it at entropy 4.18 purely because Crockford base32
  # looks like a key. Without this entry the scan fails on hundreds of
  # pre-existing test fixtures across the tree.
  '''01ARZ3NDEKTSV4RRFFQ69G5FAV''',

  # Pinned SHA-256 checksums in the provisioning scripts, e.g.
  # `WHISPER_TOKENIZER_SHA=27fc476…`. A 64-character lowercase-hex value is a
  # digest, not a credential — and these in particular are the *mechanism*
  # ADR-032 uses to refuse a downloaded model whose bytes do not match. They are
  # meant to be public, committed, and reviewed in the diff; a checksum that had
  # to be kept secret would not be doing its job.
  #
  # `generic-api-key` flags them on entropy alone, exactly as it flags the ULID
  # above. Deliberately narrow: it matches only a `<NAME>_SHA=` assignment
  # followed by 64 hex characters, so an actual key assigned to an actual
  # key-shaped variable is still caught.
  '''[A-Z0-9_]*_SHA=[0-9a-f]{64}''',
]
