# CI (docs/03 §6). Every PR runs the full loop; do not merge with warnings.
# The Rust toolchain is pinned by rust-toolchain.toml; jobs rely on rustup
# honoring it. Postgres comes from the project's own compose file so CI and
# local dev share one environment (docs/07 §1).
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: 'true'
  DATABASE_URL: postgres://jarvis:jarvis-dev-only@127.0.0.1:5432/jarvis

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain # installs the pinned toolchain + components
      - name: audio build dependencies (cpal → ALSA, F8.2)
        uses: ./.github/actions/audio-deps
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: cargo xtask codegen --check # generated TS types must match contracts
      - run: cargo xtask arch-test # dependency-direction rules (NFR-08)

  wake-word-engine:
    # ADR-032's last consequence keeps ONNX Runtime behind a feature, so no other
    # job in this workflow ever compiles the wake-word engine. Without this one it
    # would rot silently in between satellite image builds, and "the node answers
    # to its name" would stop being true without a single red check.
    #
    # The model assets are deliberately NOT provisioned here (ADR-032 consequence
    # 3 — provisioned, never vendored), so F8.3's acceptance tests skip. What this
    # proves is that the engine still builds, still lints, and still agrees with
    # the port; that it still *detects* is proven on a machine with the assets and
    # recorded in the M8a gate report.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - name: audio build dependencies (cpal → ALSA, F8.2)
        uses: ./.github/actions/audio-deps
      - run: cargo clippy -p jarvis-agent --features wake-word-onnx --all-targets -- -D warnings
      - run: cargo test -p jarvis-agent --features wake-word-onnx

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - name: audio build dependencies (cpal → ALSA, F8.2)
        uses: ./.github/actions/audio-deps
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: start postgres (pgvector)
        run: docker compose -f infra/compose/dev.yml up -d postgres
      - name: wait for postgres
        run: |
          for _ in $(seq 1 30); do
            docker exec jarvis-dev-postgres-1 pg_isready -U jarvis -d jarvis && exit 0
            sleep 1
          done
          exit 1
      # Compile-time query checking uses the committed .sqlx cache (SQLX_OFFLINE
      # stays true from the workflow env) — no migrated DB needed to build. The
      # #[sqlx::test] DB tests create their own throwaway databases at runtime
      # and apply the migrator themselves, using DATABASE_URL + the live server.
      - name: cargo test --workspace (unit + contract + DB tests)
        run: cargo test --workspace
      # sqlx prepare --check re-derives query metadata from a LIVE schema and
      # diffs it against .sqlx, so this step alone needs the DB migrated and
      # runs online.
      - name: sqlx offline query data check
        env:
          SQLX_OFFLINE: 'false'
        run: |
          cargo install sqlx-cli --no-default-features --features postgres,rustls --locked
          sqlx migrate run
          cargo sqlx prepare --check --workspace
      - name: web tests (headless)
        working-directory: web
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          npm ci
          npm test -- --browsers=ChromeHeadlessNoSandbox

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - name: audio build dependencies (cpal → ALSA, F8.2)
        uses: ./.github/actions/audio-deps
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cargo build --workspace --release
      - run: npm ci && npm run build
        working-directory: web

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - name: audio build dependencies (cpal → ALSA, F8.2)
        uses: ./.github/actions/audio-deps
      - name: cargo deny (licenses, advisories, bans, sources)
        run: |
          cargo install cargo-deny --locked
          cargo deny check
      - name: secret scan (gitleaks)
        run: |
          VERSION=8.30.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --no-banner

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [test, build]
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - name: audio build dependencies (cpal → ALSA, F8.2)
        uses: ./.github/actions/audio-deps
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: compose env (postgres + otel)
        run: docker compose -f infra/compose/dev.yml up -d
      - name: apply migrations
        env:
          SQLX_OFFLINE: 'false'
        run: |
          for _ in $(seq 1 30); do
            docker exec jarvis-dev-postgres-1 pg_isready -U jarvis -d jarvis && break
            sleep 1
          done
          cargo install sqlx-cli --no-default-features --features postgres,rustls --locked
          sqlx migrate run
      - run: cargo build -p jarvisd
      - name: build web assets
        working-directory: web
        run: npm ci && npm run build
      - name: session round-trip smoke (exit evidence)
        run: bash infra/ci/smoke.sh
      # Traces 1-6 are pure application-layer suites; trace 7 and the M3a
      # acceptance scenarios (F3a.8) need this job's compose Postgres plus node
      # and git for the real coding worker.
      - name: golden traces 1-7 + M3a acceptance scenarios
        run: cargo xtask golden

  install-artifact:
    name: the signed release installs on a clean host
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: audio build dependencies (cpal → ALSA, F8.2)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo install cargo-deny --locked
      - name: cut a release
        run: |
          set -euo pipefail
          # An EPHEMERAL key. This proves the pipeline produces a verifiable
          # release, not that a particular key signed it — the real signing key
          # never goes near a CI runner (docs/06 §9).
          ssh-keygen -t ed25519 -N "" -f /tmp/ci-release-key
          JARVIS_RELEASE_KEY=/tmp/ci-release-key infra/install/release.sh /tmp/rel
          infra/install/verify-release.sh /tmp/rel/jarvis-*
      - name: install it in a container that has never had Jarvis
        run: |
          set -euo pipefail
          release=$(ls -d /tmp/rel/jarvis-*)
          # A pristine ubuntu:24.04 — no Rust, no Node, no source tree. That is
          # the whole claim. systemd does not run usefully in a container, so
          # --skip-systemd: this proves PREFLIGHT and PLACEMENT. Boot ordering
          # stays a human check, and docs/09 says so, rather than being faked
          # with a check that stays green while the system is broken.
          docker run --rm -v "$release:/release:ro" ubuntu:24.04 bash -euxc '
            apt-get update -qq
            # openssh-client for ssh-keygen: install.sh now VERIFIES the release
            # before it copies anything as root, and refuses if it cannot. That
            # is the default path an owner takes, so it is the path CI must
            # exercise — not --skip-verify, which would test the escape hatch.
            apt-get install -y -qq libasound2t64 curl ca-certificates openssh-client >/dev/null
            cp -r /release /install && cd /install
            ./install/install.sh --skip-preflight --skip-systemd

            test -x /usr/local/bin/jarvisd
            test -f /etc/jarvis/jarvisd.toml
            test -f /etc/jarvis/compose/prod.yml
            test -f /etc/systemd/system/jarvis-deps.service
            test -d /var/lib/jarvis/web

            # Root-only, and not a placeholder.
            [ "$(stat -c %a /etc/jarvis/secrets.env)" = "600" ]
            grep -q "^JARVIS_DB_URL=postgres://" /etc/jarvis/secrets.env
            ! grep -q "jarvis-dev-only" /etc/jarvis/secrets.env

            # The binary runs at all — the glibc question, answered.
            /usr/local/bin/jarvisd frobnicate 2>&1 | grep -q usage
          '
      - name: package for release
        run: |
          set -euo pipefail
          release=$(ls -d /tmp/rel/jarvis-*)
          name=$(basename "$release")
          tar --zstd -cf "$name-x86_64-linux-gnu.tar.zst" -C /tmp/rel "$name"
      # A build artifact, retained for 14 days, reachable only from this run —
      # NOT a published release.
      #
      # There was a `release:` job here that ran `gh release create` on a `v*`
      # tag. It is gone, deliberately. It uploaded THIS tarball — signed with the
      # ephemeral key generated four steps up — to exactly the URL the README
      # tells an owner to download from, and the README's next line is
      # `verify-release.sh`, which would have printed "release verified" over it.
      # Nobody can ever obtain a --signers file for such a release, because the
      # key ceases to exist when the runner does. So the flow would have looked
      # verified and proven nothing about who built it, which is worse than an
      # unverified download that says so.
      #
      # Publishing a release an owner should trust is a local step with the real
      # key (docs/06 §9): `infra/install/release.sh dist/`, then
      # `gh release create v<version> dist/jarvis-<version>*.tar.zst`. See the
      # README's "Building it yourself" section.
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-release
          path: "*.tar.zst"
          retention-days: 14
