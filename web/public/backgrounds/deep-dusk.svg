<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Deep dusk wallpaper">
  <!-- Worst case for DARK ink: a saturated dark field. With the wallpaper glass
       column active the panel must still carry dark body text at >= 4.5:1
       (docs/12 §5/§9). Bundled as SVG: scales anywhere, needs no network. -->
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2740" />
      <stop offset="45%" stop-color="#101826" />
      <stop offset="100%" stop-color="#2a1c33" />
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#dusk)" />
  <g opacity="0.5">
    <circle cx="1300" cy="180" r="260" fill="#31406b" />
    <circle cx="260" cy="760" r="300" fill="#3a2450" />
  </g>
</svg>
